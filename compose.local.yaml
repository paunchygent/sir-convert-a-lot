services:
  sir_convert_a_lot_dev:
    image: sir-convert-a-lot-runtime-local:${SIR_CONVERT_A_LOT_LOCAL_IMAGE_TAG:-local-cpu}
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: sir_convert_a_lot_dev
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - SIR_CONVERT_A_LOT_SERVICE_REVISION=${SIR_CONVERT_A_LOT_SERVICE_REVISION:-unknown}
      - SIR_CONVERT_A_LOT_EXPECTED_REVISION=${SIR_CONVERT_A_LOT_EXPECTED_REVISION:-unknown}
      - SIR_CONVERT_A_LOT_DATA_DIR=/var/lib/sir-convert-a-lot/local
      - SIR_CONVERT_A_LOT_DEFAULT_PDF_OCR_ENGINE=tesseract_cli
      - SIR_CONVERT_A_LOT_DEFAULT_PDF_OCR_LANGUAGES=sv,en
      - SIR_CONVERT_A_LOT_EASYOCR_MODEL_STORAGE_DIR=/opt/easyocr-models
    command:
      - uvicorn
      - scripts.sir_convert_a_lot.service_local:app
      - --host
      - 0.0.0.0
      - --port
      - "8085"
    ports:
      - "${SIR_CONVERT_A_LOT_LOCAL_PORT:-8085}:8085"
    volumes:
      - sir-convert-a-lot-local-data:/var/lib/sir-convert-a-lot/local
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8085/readyz')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  sir-convert-a-lot-local-data:
