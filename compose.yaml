---
services:
  sir_convert_a_lot_prod:
    image: sir-convert-a-lot-runtime:${SIR_CONVERT_A_LOT_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEPS_IMAGE:
          "${SIR_CONVERT_A_LOT_DEPS_IMAGE:-sir-convert-a-lot-deps-rocm:\
          local}"
    container_name: sir_convert_a_lot_prod
    restart: "no"
    environment:
      - SIR_CONVERT_A_LOT_V2_API_KEY=${SIR_CONVERT_A_LOT_V2_API_KEY:-dev-only-key}
      - SIR_CONVERT_A_LOT_EXAM_AUTHORING_SOURCE_STATE_SIGNATURE_SECRET=${SIR_CONVERT_A_LOT_EXAM_AUTHORING_SOURCE_STATE_SIGNATURE_SECRET:-}
      - SIR_CONVERT_A_LOT_SERVICE_REVISION=${SIR_CONVERT_A_LOT_SERVICE_REVISION:-unknown}
      - SIR_CONVERT_A_LOT_EXPECTED_REVISION=${SIR_CONVERT_A_LOT_EXPECTED_REVISION:-unknown}
      - SIR_CONVERT_A_LOT_DATA_DIR=/var/lib/sir-convert-a-lot/prod
      - SIR_CONVERT_A_LOT_GPU_AVAILABLE=0
      - SIR_CONVERT_A_LOT_ENABLE_SUPERVISOR=0
      - SIR_CONVERT_A_LOT_RUN_JOBS_ON_SUBMIT=0
      - SIR_CONVERT_A_LOT_MAX_WORKERS=${SIR_CONVERT_A_LOT_MAX_WORKERS:-1}
      - SIR_CONVERT_A_LOT_ENABLE_PARALLEL_PDF_CHUNKS=${SIR_CONVERT_A_LOT_ENABLE_PARALLEL_PDF_CHUNKS:-0}
      - SIR_CONVERT_A_LOT_MAX_CHUNK_WORKERS=${SIR_CONVERT_A_LOT_MAX_CHUNK_WORKERS:-1}
      - SIR_CONVERT_A_LOT_PDF_CHUNK_SIZE_PAGES=${SIR_CONVERT_A_LOT_PDF_CHUNK_SIZE_PAGES:-10}
      - SIR_CONVERT_A_LOT_ENABLE_SSE_STREAM=${SIR_CONVERT_A_LOT_ENABLE_SSE_STREAM:-0}
      - SIR_CONVERT_A_LOT_SSE_REPLAY_HORIZON_SECONDS=${SIR_CONVERT_A_LOT_SSE_REPLAY_HORIZON_SECONDS:-86400}
      - SIR_CONVERT_A_LOT_SSE_POLL_INTERVAL_SECONDS=${SIR_CONVERT_A_LOT_SSE_POLL_INTERVAL_SECONDS:-0.05}
      - SIR_CONVERT_A_LOT_SSE_STREAM_MAX_SECONDS=${SIR_CONVERT_A_LOT_SSE_STREAM_MAX_SECONDS:-15.0}
      - SIR_CONVERT_A_LOT_ENABLE_WEBHOOK_ONBOARDING=${SIR_CONVERT_A_LOT_ENABLE_WEBHOOK_ONBOARDING:-0}
      - SIR_CONVERT_A_LOT_WEBHOOK_SECRET_OVERLAP_SECONDS=${SIR_CONVERT_A_LOT_WEBHOOK_SECRET_OVERLAP_SECONDS:-86400}
      - SIR_CONVERT_A_LOT_ENABLE_WEBHOOK_DELIVERY=${SIR_CONVERT_A_LOT_ENABLE_WEBHOOK_DELIVERY:-0}
      - SIR_CONVERT_A_LOT_STT_SIDECAR_BASE_URL=http://sir_convert_a_lot_stt_sidecar:8095
      - SIR_CONVERT_A_LOT_STT_SIDECAR_TIMEOUT_SECONDS=${SIR_CONVERT_A_LOT_STT_SIDECAR_TIMEOUT_SECONDS:-7200}
      - SIR_CONVERT_A_LOT_STT_SIDECAR_INPUT_DIR=/var/lib/sir-convert-a-lot/stt-sidecar-inputs
      - SIR_CONVERT_A_LOT_DEFAULT_PDF_OCR_ENGINE=easyocr
      - SIR_CONVERT_A_LOT_DEFAULT_PDF_OCR_LANGUAGES=sv,en
      - SIR_CONVERT_A_LOT_EASYOCR_MODEL_STORAGE_DIR=/opt/easyocr-models
      - MIOPEN_FIND_MODE=${MIOPEN_FIND_MODE:-FAST}
      - MIOPEN_USER_DB_PATH=${MIOPEN_USER_DB_PATH:-/srv/scratch/sir-convert-a-lot/cache/miopen/user-db}
      - MIOPEN_CUSTOM_CACHE_DIR=${MIOPEN_CUSTOM_CACHE_DIR:-/srv/scratch/sir-convert-a-lot/cache/miopen/kernel-cache}
      - SIR_CONVERT_A_LOT_DOCLING_LAYOUT_MODEL=${SIR_CONVERT_A_LOT_DOCLING_LAYOUT_MODEL:-docling_layout_egret_large}
      - SIR_CONVERT_A_LOT_DOCLING_LAYOUT_FALLBACK_MODELS=${SIR_CONVERT_A_LOT_DOCLING_LAYOUT_FALLBACK_MODELS:-docling_layout_heron}
      - SIR_CONVERT_A_LOT_DOCLING_ORDERING_PATCH=${SIR_CONVERT_A_LOT_DOCLING_ORDERING_PATCH:-1}
      - SIR_CONVERT_A_LOT_DOCLING_ORDERING_QUALITY_GATE=${SIR_CONVERT_A_LOT_DOCLING_ORDERING_QUALITY_GATE:-1}
      - SIR_CONVERT_A_LOT_STRUCTURED_LLM_ENABLED=${SIR_CONVERT_A_LOT_STRUCTURED_LLM_ENABLED:-0}
      - SIR_CONVERT_A_LOT_STRUCTURED_LLM_PROVIDER_PROFILE=${SIR_CONVERT_A_LOT_STRUCTURED_LLM_PROVIDER_PROFILE:-}
      - SIR_CONVERT_A_LOT_STRUCTURED_LLM_RUNTIME_LANE=${SIR_CONVERT_A_LOT_STRUCTURED_LLM_RUNTIME_LANE:-local-compose}
      - SIR_CONVERT_A_LOT_STRUCTURED_LLM_PROVIDERS_JSON=${SIR_CONVERT_A_LOT_STRUCTURED_LLM_PROVIDERS_JSON:-}
      - SIR_CONVERT_A_LOT_STRUCTURED_LLM_PRIMARY_PROVIDER_ID=${SIR_CONVERT_A_LOT_STRUCTURED_LLM_PRIMARY_PROVIDER_ID:-}
      - SIR_CONVERT_A_LOT_STRUCTURED_LLM_FALLBACK_PROVIDER_ID=${SIR_CONVERT_A_LOT_STRUCTURED_LLM_FALLBACK_PROVIDER_ID:-}
      - SIR_CONVERT_A_LOT_STRUCTURED_LLM_REMOTE_PROVIDERS_ENABLED=${SIR_CONVERT_A_LOT_STRUCTURED_LLM_REMOTE_PROVIDERS_ENABLED:-0}
      - SIR_CONVERT_A_LOT_STRUCTURED_LLM_REMOTE_FALLBACK_POLICY_AUTHORIZED=${SIR_CONVERT_A_LOT_STRUCTURED_LLM_REMOTE_FALLBACK_POLICY_AUTHORIZED:-0}
      - SIR_CONVERT_A_LOT_STRUCTURED_LLM_VISION_MEDIA_PATH=${SIR_CONVERT_A_LOT_STRUCTURED_LLM_VISION_MEDIA_PATH:-/srv/scratch/sir-convert-a-lot/build/verification/answer-key-qwen-provider/vision-assets}
      - SIR_CONVERT_A_LOT_OPENAI_API_KEY=${SIR_CONVERT_A_LOT_OPENAI_API_KEY:-}
      - HULEEDU_INTERNAL_IDENTITY_PUBLIC_KEY_PATH=/run/secrets/huleedu-gateway-internal-identity-public-key.pem
      - "HULEEDU_INTERNAL_IDENTITY_TRUST_PROFILE_JSON=\
        ${HULEEDU_INTERNAL_IDENTITY_TRUST_PROFILE_JSON:\
        ?Set sanitized \
        HuleEdu hemma-production internal identity trust profile JSON}"
    command:
      - uvicorn
      - scripts.sir_convert_a_lot.service:app
      - --host
      - 0.0.0.0
      - --port
      - "8085"
    ports:
      - "${SIR_CONVERT_A_LOT_PROD_PORT:-8085}:8085"
    volumes:
      - sir-convert-a-lot-prod-data:/var/lib/sir-convert-a-lot/prod
      - sir-convert-a-lot-stt-sidecar-inputs:/var/lib/sir-convert-a-lot/stt-sidecar-inputs
      - ${SIR_CONVERT_A_LOT_MIOPEN_CACHE_HOST_DIR:-/home/paunchygent/.data/sir-convert-a-lot/cache/miopen}:/srv/scratch/sir-convert-a-lot/cache/miopen
      - ${SIR_CONVERT_A_LOT_STRUCTURED_LLM_VISION_MEDIA_HOST_PATH:-/home/paunchygent/.data/sir-convert-a-lot/build/verification/answer-key-qwen-provider/vision-assets}:${SIR_CONVERT_A_LOT_STRUCTURED_LLM_VISION_MEDIA_PATH:-/srv/scratch/sir-convert-a-lot/build/verification/answer-key-qwen-provider/vision-assets}
      - ${HULEEDU_INTERNAL_IDENTITY_PUBLIC_KEY_HOST_PATH:-/home/paunchygent/apps/huleedu/secrets/hemma-runtime/internal-identity/gateway-internal-identity-public-key.pem}:/run/secrets/huleedu-gateway-internal-identity-public-key.pem:ro
    networks:
      - hule-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:\
          8085/readyz')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  sir_convert_a_lot_gpu_worker:
    image: sir-convert-a-lot-runtime:${SIR_CONVERT_A_LOT_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEPS_IMAGE:
          "${SIR_CONVERT_A_LOT_DEPS_IMAGE:-sir-convert-a-lot-deps-rocm:\
          local}"
    container_name: sir_convert_a_lot_gpu_worker
    restart: "no"
    environment:
      - SIR_CONVERT_A_LOT_V2_API_KEY=${SIR_CONVERT_A_LOT_V2_API_KEY:-dev-only-key}
      - SIR_CONVERT_A_LOT_EXAM_AUTHORING_SOURCE_STATE_SIGNATURE_SECRET=${SIR_CONVERT_A_LOT_EXAM_AUTHORING_SOURCE_STATE_SIGNATURE_SECRET:-}
      - SIR_CONVERT_A_LOT_SERVICE_REVISION=${SIR_CONVERT_A_LOT_SERVICE_REVISION:-unknown}
      - SIR_CONVERT_A_LOT_EXPECTED_REVISION=${SIR_CONVERT_A_LOT_EXPECTED_REVISION:-unknown}
      - SIR_CONVERT_A_LOT_DATA_DIR=/var/lib/sir-convert-a-lot/prod
      - SIR_CONVERT_A_LOT_GPU_AVAILABLE=${SIR_CONVERT_A_LOT_GPU_AVAILABLE:-1}
      - SIR_CONVERT_A_LOT_ENABLE_SUPERVISOR=1
      - SIR_CONVERT_A_LOT_RUN_JOBS_ON_SUBMIT=0
      - SIR_CONVERT_A_LOT_MAX_WORKERS=${SIR_CONVERT_A_LOT_MAX_WORKERS:-1}
      - SIR_CONVERT_A_LOT_ENABLE_PARALLEL_PDF_CHUNKS=${SIR_CONVERT_A_LOT_ENABLE_PARALLEL_PDF_CHUNKS:-0}
      - SIR_CONVERT_A_LOT_MAX_CHUNK_WORKERS=${SIR_CONVERT_A_LOT_MAX_CHUNK_WORKERS:-1}
      - SIR_CONVERT_A_LOT_PDF_CHUNK_SIZE_PAGES=${SIR_CONVERT_A_LOT_PDF_CHUNK_SIZE_PAGES:-10}
      - SIR_CONVERT_A_LOT_ENABLE_SSE_STREAM=0
      - SIR_CONVERT_A_LOT_ENABLE_WEBHOOK_ONBOARDING=0
      - SIR_CONVERT_A_LOT_ENABLE_WEBHOOK_DELIVERY=0
      - SIR_CONVERT_A_LOT_STT_SIDECAR_BASE_URL=http://sir_convert_a_lot_stt_sidecar:8095
      - SIR_CONVERT_A_LOT_STT_SIDECAR_TIMEOUT_SECONDS=${SIR_CONVERT_A_LOT_STT_SIDECAR_TIMEOUT_SECONDS:-7200}
      - SIR_CONVERT_A_LOT_STT_SIDECAR_INPUT_DIR=/var/lib/sir-convert-a-lot/stt-sidecar-inputs
      - SIR_CONVERT_A_LOT_DEFAULT_PDF_OCR_ENGINE=easyocr
      - SIR_CONVERT_A_LOT_DEFAULT_PDF_OCR_LANGUAGES=sv,en
      - SIR_CONVERT_A_LOT_EASYOCR_MODEL_STORAGE_DIR=/opt/easyocr-models
      - MIOPEN_FIND_MODE=${MIOPEN_FIND_MODE:-FAST}
      - MIOPEN_USER_DB_PATH=${MIOPEN_USER_DB_PATH:-/srv/scratch/sir-convert-a-lot/cache/miopen/user-db}
      - MIOPEN_CUSTOM_CACHE_DIR=${MIOPEN_CUSTOM_CACHE_DIR:-/srv/scratch/sir-convert-a-lot/cache/miopen/kernel-cache}
      - SIR_CONVERT_A_LOT_DOCLING_LAYOUT_MODEL=${SIR_CONVERT_A_LOT_DOCLING_LAYOUT_MODEL:-docling_layout_egret_large}
      - SIR_CONVERT_A_LOT_DOCLING_LAYOUT_FALLBACK_MODELS=${SIR_CONVERT_A_LOT_DOCLING_LAYOUT_FALLBACK_MODELS:-docling_layout_heron}
      - SIR_CONVERT_A_LOT_DOCLING_ORDERING_PATCH=${SIR_CONVERT_A_LOT_DOCLING_ORDERING_PATCH:-1}
      - SIR_CONVERT_A_LOT_DOCLING_ORDERING_QUALITY_GATE=${SIR_CONVERT_A_LOT_DOCLING_ORDERING_QUALITY_GATE:-1}
      - SIR_CONVERT_A_LOT_STRUCTURED_LLM_ENABLED=${SIR_CONVERT_A_LOT_STRUCTURED_LLM_ENABLED:-0}
      - SIR_CONVERT_A_LOT_STRUCTURED_LLM_PROVIDER_PROFILE=${SIR_CONVERT_A_LOT_STRUCTURED_LLM_PROVIDER_PROFILE:-}
      - SIR_CONVERT_A_LOT_STRUCTURED_LLM_RUNTIME_LANE=${SIR_CONVERT_A_LOT_STRUCTURED_LLM_RUNTIME_LANE:-local-compose}
      - SIR_CONVERT_A_LOT_STRUCTURED_LLM_PROVIDERS_JSON=${SIR_CONVERT_A_LOT_STRUCTURED_LLM_PROVIDERS_JSON:-}
      - SIR_CONVERT_A_LOT_STRUCTURED_LLM_PRIMARY_PROVIDER_ID=${SIR_CONVERT_A_LOT_STRUCTURED_LLM_PRIMARY_PROVIDER_ID:-}
      - SIR_CONVERT_A_LOT_STRUCTURED_LLM_FALLBACK_PROVIDER_ID=${SIR_CONVERT_A_LOT_STRUCTURED_LLM_FALLBACK_PROVIDER_ID:-}
      - SIR_CONVERT_A_LOT_STRUCTURED_LLM_REMOTE_PROVIDERS_ENABLED=${SIR_CONVERT_A_LOT_STRUCTURED_LLM_REMOTE_PROVIDERS_ENABLED:-0}
      - SIR_CONVERT_A_LOT_STRUCTURED_LLM_REMOTE_FALLBACK_POLICY_AUTHORIZED=${SIR_CONVERT_A_LOT_STRUCTURED_LLM_REMOTE_FALLBACK_POLICY_AUTHORIZED:-0}
      - SIR_CONVERT_A_LOT_STRUCTURED_LLM_VISION_MEDIA_PATH=${SIR_CONVERT_A_LOT_STRUCTURED_LLM_VISION_MEDIA_PATH:-/srv/scratch/sir-convert-a-lot/build/verification/answer-key-qwen-provider/vision-assets}
      - SIR_CONVERT_A_LOT_OPENAI_API_KEY=${SIR_CONVERT_A_LOT_OPENAI_API_KEY:-}
      - HULEEDU_INTERNAL_IDENTITY_PUBLIC_KEY_PATH=/run/secrets/huleedu-gateway-internal-identity-public-key.pem
      - "HULEEDU_INTERNAL_IDENTITY_TRUST_PROFILE_JSON=\
        ${HULEEDU_INTERNAL_IDENTITY_TRUST_PROFILE_JSON:\
        ?Set sanitized \
        HuleEdu hemma-production internal identity trust profile JSON}"
    command:
      - uvicorn
      - scripts.sir_convert_a_lot.service:app
      - --host
      - 0.0.0.0
      - --port
      - "8085"
    expose:
      - "8085"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${SIR_CONVERT_A_LOT_GPU_VIDEO_GROUP_ID:-44}"
      - "${SIR_CONVERT_A_LOT_GPU_RENDER_GROUP_ID:-993}"
    volumes:
      - sir-convert-a-lot-prod-data:/var/lib/sir-convert-a-lot/prod
      - sir-convert-a-lot-stt-sidecar-inputs:/var/lib/sir-convert-a-lot/stt-sidecar-inputs
      - ${SIR_CONVERT_A_LOT_MIOPEN_CACHE_HOST_DIR:-/home/paunchygent/.data/sir-convert-a-lot/cache/miopen}:/srv/scratch/sir-convert-a-lot/cache/miopen
      - ${SIR_CONVERT_A_LOT_STRUCTURED_LLM_VISION_MEDIA_HOST_PATH:-/home/paunchygent/.data/sir-convert-a-lot/build/verification/answer-key-qwen-provider/vision-assets}:${SIR_CONVERT_A_LOT_STRUCTURED_LLM_VISION_MEDIA_PATH:-/srv/scratch/sir-convert-a-lot/build/verification/answer-key-qwen-provider/vision-assets}
      - ${HULEEDU_INTERNAL_IDENTITY_PUBLIC_KEY_HOST_PATH:-/home/paunchygent/apps/huleedu/secrets/hemma-runtime/internal-identity/gateway-internal-identity-public-key.pem}:/run/secrets/huleedu-gateway-internal-identity-public-key.pem:ro
    networks:
      - hule-network
    depends_on:
      sir_convert_a_lot_stt_sidecar:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:\
          8085/readyz')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  sir_convert_a_lot_stt_sidecar:
    image:
      "sir-convert-a-lot-stt-sidecar:${SIR_CONVERT_A_LOT_\
      STT_SIDECAR_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: containers/stt-sidecar-benchmark/Dockerfile
      args:
        BASE_IMAGE:
          "${SIR_CONVERT_A_LOT_DEPS_IMAGE:-sir-convert-a-lot-deps-rocm:\
          local}"
    container_name: sir_convert_a_lot_stt_sidecar
    restart: unless-stopped
    environment:
      - HF_HOME=/cache/huggingface
      - HF_HUB_CACHE=/cache/huggingface/hub
      - TRANSFORMERS_CACHE=/cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
      - SIR_STT_SIDECAR_BACKEND_PROFILE_ID=stt_sv_en_primary
      - SIR_STT_SIDECAR_BACKEND_VERSION=faster_whisper_pyannote_profile
      - SIR_STT_SIDECAR_STT_PROFILE_LABEL=stt_sv_en_primary
      - SIR_STT_SIDECAR_DIARIZATION_PROFILE_LABEL=diarization_sv_en_primary
      - SIR_STT_SIDECAR_ACCELERATION_FAMILY=rocm
      - SIR_STT_SIDECAR_BATCH_SIZE=8
      - SIR_STT_SIDECAR_IDLE_UNLOAD_SECONDS=${SIR_STT_SIDECAR_IDLE_UNLOAD_SECONDS:-900}
    command:
      - uvicorn
      - scripts.sir_convert_a_lot.stt_sidecar.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8095"
    expose:
      - "8095"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${SIR_CONVERT_A_LOT_GPU_VIDEO_GROUP_ID:-44}"
      - "${SIR_CONVERT_A_LOT_GPU_RENDER_GROUP_ID:-993}"
    volumes:
      - sir-convert-a-lot-prod-data:/var/lib/sir-convert-a-lot/prod
      - sir-convert-a-lot-stt-sidecar-inputs:/var/lib/sir-convert-a-lot/stt-sidecar-inputs
      - ${SIR_CONVERT_A_LOT_HF_CACHE_HOST_DIR:-/home/paunchygent/.data/sir-convert-a-lot/cache/huggingface}:/cache/huggingface
    networks:
      - hule-network
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8095/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  sir_convert_qwen_answer_key:
    profiles:
      - qwen-answer-key
    image:
      "sir-convert-qwen-llama-runtime:${SIR_CONVERT_A_LOT_\
      QWEN_PROVIDER_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: Dockerfile.qwen-provider
      args:
        QWEN_PROVIDER_BASE_IMAGE:
          "${SIR_CONVERT_A_LOT_QWEN_PROVIDER_BASE_IMAGE:-rocm/vllm:\
          rocm7.12.0_gfx120X-all_ubuntu24.04_py3.12_pytorch_2.9.1_vllm_0.16.0}"
    container_name: sir_convert_qwen_answer_key
    restart: unless-stopped
    environment:
      - LLAMA_CACHE=/srv/scratch/sir-convert-a-lot/cache/llama.cpp
      - XDG_CACHE_HOME=/srv/scratch/sir-convert-a-lot/cache
      - LD_LIBRARY_PATH=${SIR_CONVERT_A_LOT_QWEN_ROCM_LIBRARY_PATH:-/opt/python/lib/python3.12/site-packages/_rocm_sdk_devel/lib:/opt/python/lib/python3.12/site-packages/_rocm_sdk_libraries_gfx120X_all/lib:/opt/python/lib/python3.12/site-packages/_rocm_sdk_core/lib:/usr/lib/x86_64-linux-gnu}
    command:
      - /srv/scratch/sir-convert-a-lot/bin/llama-server
      - -hf
      - ${SIR_CONVERT_A_LOT_QWEN36_HF_REPO:-unsloth/Qwen3.6-27B-MTP-GGUF}
      - -hff
      - ${SIR_CONVERT_A_LOT_QWEN36_HF_FILE:-Qwen3.6-27B-Q6_K.gguf}
      - --no-webui
      - --alias
      - ${SIR_CONVERT_A_LOT_QWEN36_MODEL:-qwen3.6-27b-q6k-mtp}
      - --host
      - 0.0.0.0
      - --port
      - "8082"
      - --ctx-size
      - "16384"
      - --parallel
      - "1"
      - --n-gpu-layers
      - all
      - --fit
      - "off"
      - --flash-attn
      - "on"
      - --jinja
      - --reasoning
      - "off"
      - --temp
      - ${SIR_CONVERT_A_LOT_QWEN36_TEMPERATURE:-0.15}
      - --offline
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - "2"
      - --media-path
      - ${SIR_CONVERT_A_LOT_STRUCTURED_LLM_VISION_MEDIA_PATH:-/srv/scratch/sir-convert-a-lot/build/verification/answer-key-qwen-provider/vision-assets}
      - --log-file
      - /srv/scratch/sir-convert-a-lot/build/verification/answer-key-qwen-provider/qwen3.6-27b-q6k-mtp-llama-server.log
    expose:
      - "8082"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${SIR_CONVERT_A_LOT_GPU_VIDEO_GROUP_ID:-44}"
      - "${SIR_CONVERT_A_LOT_GPU_RENDER_GROUP_ID:-993}"
    volumes:
      - ${SIR_CONVERT_A_LOT_QWEN_LLAMA_SERVER_HOST_PATH:-/home/paunchygent/.data/sir-convert-a-lot/build/llama.cpp-qwen35/build-hip/bin/llama-server}:/srv/scratch/sir-convert-a-lot/bin/llama-server:ro
      - ${SIR_CONVERT_A_LOT_QWEN_DOCKER_BUILD_HOST_PATH:-/home/paunchygent/.data/sir-convert-a-lot/build}:/srv/scratch/sir-convert-a-lot/build
      - ${SIR_CONVERT_A_LOT_QWEN_DOCKER_CACHE_HOST_PATH:-/home/paunchygent/.data/sir-convert-a-lot/cache}:/srv/scratch/sir-convert-a-lot/cache
    networks:
      - hule-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:\
          8082/v1/models')",
        ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  sir_convert_a_lot_public_reserved:
    image: nginx:1.27-alpine
    container_name: sir_convert_a_lot_public_reserved
    restart: unless-stopped
    volumes:
      - ./docker/public-edge/reserved-default.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8080"
    environment:
      - VIRTUAL_HOST=${SIR_CONVERT_A_LOT_PUBLIC_HOST:-convert.hule.education}
      - VIRTUAL_PORT=8080
      - LETSENCRYPT_HOST=${SIR_CONVERT_A_LOT_PUBLIC_HOST:-convert.hule.education}
    networks:
      - hule-network

volumes:
