[project]
name = "sir-convert-a-lot"
version = "0.1.0"
description = "Standalone, LLM-friendly conversion platform with canonical CLI/API surfaces."
authors = [
    { name = "Olof Larsson", email = "paunchygent@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.128.8",
    "uvicorn>=0.40.0",
    "python-multipart>=0.0.22",
    "prometheus-client>=0.23.1",
    "httpx>=0.28.1",
    "typer>=0.16.0",
    "pydantic>=2.11.7",
    "pyyaml>=6.0.3",
    "mdformat>=1.0.0",
    "mdformat-gfm>=0.4.1",
    "weasyprint>=63.0",
    "docling==2.73.1",
    "easyocr==1.7.2",
    "pymupdf4llm==0.3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=6.2.1",
    "ruff>=0.14.0",
    "mypy>=1.18.2",
    "types-pyyaml>=6.0.12.20250915",
    "mdformat-frontmatter>=2.0.10",
]
qwen-preprocessing = [
    "accelerate==1.12.0",
    "datasets>=4.1.1",
    "huggingface-hub==0.34.4",
    "jiwer>=4.0.0",
    "librosa==0.11.0",
    "onnxruntime==1.23.1",
    "qwen-tts==0.1.1",
    "safetensors==0.5.3",
    "sentencepiece==0.2.1",
    "soundfile==0.13.1",
    "sox==1.5.0",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "transformers==4.57.3",
    "pyarrow==23.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_return_any = true
check_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true
files = [
    "scripts/sir_convert_a_lot",
    "scripts/docs_as_code",
    "tests/sir_convert_a_lot",
]

[tool.pytest.ini_options]
addopts = "-s -v"
python_files = "test_*.py *_test.py"
pythonpath = "."
testpaths = ["tests"]
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.coverage.run]
source = [
    "scripts.sir_convert_a_lot.application.contracts_v2",
    "scripts.sir_convert_a_lot.domain.specs_v2",
    "scripts.sir_convert_a_lot.infrastructure.job_store_models_v2",
    "scripts.sir_convert_a_lot.infrastructure.runtime_models_v2",
    "scripts.sir_convert_a_lot.infrastructure.runtime_config_v2",
    "scripts.sir_convert_a_lot.infrastructure.runtime_heartbeat_v2",
    "scripts.sir_convert_a_lot.infrastructure.v2_conversion_executor",
    "scripts.sir_convert_a_lot.infrastructure.runtime_engine_v2",
    "scripts.sir_convert_a_lot.interfaces.http_routes_jobs_v2",
]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
precision = 1

[tool.pdm]
distribution = false

[tool.pdm.scripts]
"serve:sir-convert-a-lot" = "uvicorn scripts.sir_convert_a_lot.service:app --host 0.0.0.0 --port 8085"
"convert-a-lot" = "python -m scripts.sir_convert_a_lot.interfaces.cli_app"
"sir-convert-a-lot" = "python -m scripts.sir_convert_a_lot.interfaces.cli_app"
"benchmark:story-003b" = "python -m scripts.sir_convert_a_lot.benchmark_gpu_governance"
"benchmark:task-72" = "python -m scripts.sir_convert_a_lot.benchmark_story20_parallel_throughput"
"benchmark:task-74" = "python -m scripts.sir_convert_a_lot.benchmark_story20_throughput_report"
"benchmark:task-74-two-worker-sweep" = "python -m scripts.sir_convert_a_lot.benchmark_story20_throughput_report --two-worker-sweep"
"benchmark:task-74-hemma" = "python -m scripts.sir_convert_a_lot.devops.run_task74_hemma_benchmark"
"benchmark:task-74-two-worker-sweep-hemma" = "python -m scripts.sir_convert_a_lot.devops.run_task74_hemma_benchmark --two-worker-sweep"
"benchmark:task-79" = "python -m scripts.sir_convert_a_lot.devops.run_task79_hemma_tts_sidecar_benchmark"
"benchmark:task-81" = "python -m scripts.sir_convert_a_lot.devops.run_task81_hemma_openvoice_benchmark"
"benchmark:task-85" = "python -m scripts.sir_convert_a_lot.devops.run_task85_hemma_f5_smoke"
"benchmark:task-86" = "python -m scripts.sir_convert_a_lot.devops.run_task86_hemma_chatterbox_benchmark"
"benchmark:task-87" = "python -m scripts.sir_convert_a_lot.devops.run_task87_chatterbox_tuning_sweep"
"benchmark:task-89" = "python -m scripts.sir_convert_a_lot.devops.run_task89_chatterbox_espeak_experiment"
"benchmark:task-89-hemma" = "python -m scripts.sir_convert_a_lot.devops.run_task89_hemma_chatterbox_espeak_experiment"
"benchmark:task-90" = "python -m scripts.sir_convert_a_lot.devops.run_task90_chatterbox_segmented_experiment"
"benchmark:task-90-hemma" = "python -m scripts.sir_convert_a_lot.devops.run_task90_hemma_chatterbox_segmented_experiment"
"benchmark:task-91" = "python -m scripts.sir_convert_a_lot.devops.run_task91_chatterbox_speech_aware_stitching_experiment"
"benchmark:task-91-hemma" = "python -m scripts.sir_convert_a_lot.devops.run_task91_hemma_chatterbox_speech_aware_stitching_experiment"
"benchmark:task-91-restitch" = "python -m scripts.sir_convert_a_lot.devops.run_task91_restitch_saved_chunks"
"task-100-smoke" = "python -m scripts.sir_convert_a_lot.devops.run_task100_hemma_qwen_finetune_smoke"
"task-101-pilot" = "python -m scripts.sir_convert_a_lot.devops.run_task101_hemma_qwen_pilot"
"task-103-preprocess" = "python -m scripts.sir_convert_a_lot.devops.run_task103_qwen_swedish_preprocessing"
"task-103-preprocess-public-corpus" = "python -m scripts.sir_convert_a_lot.devops.run_task114_hemma_qwen_isolated_stages"
"task-109-containerized-preprocess" = "python -m scripts.sir_convert_a_lot.devops.run_task109_hemma_qwen_containerized_preprocessing"
"task-114-isolated-stages" = "python -m scripts.sir_convert_a_lot.devops.run_task114_hemma_qwen_isolated_stages"
"task-106-acquire" = "python -m scripts.sir_convert_a_lot.devops.run_task106_hemma_qwen_corpus_acquisition"
"task-108-stage-rixvox-train" = "python -m scripts.sir_convert_a_lot.devops.run_task108_hemma_qwen_rixvox_train_staging"
"task-108-detached-proof" = "python -m scripts.sir_convert_a_lot.devops.run_task108_hemma_qwen_detached_proof"
"task-112-storage-remediation" = "python -m scripts.sir_convert_a_lot.devops.run_task112_hemma_storage_remediation"
"task-113-docker-storage-remediation" = "python -m scripts.sir_convert_a_lot.devops.run_task113_hemma_docker_storage_remediation"
"task-113-detached" = "python -m scripts.sir_convert_a_lot.devops.run_task113_hemma_docker_storage_detached"
"benchmark:task-73-telemetry" = "python -m scripts.sir_convert_a_lot.benchmark_story20_telemetry_overhead"
"benchmark:task-12" = "python -m scripts.sir_convert_a_lot.benchmark_scientific_corpus"
"validate:docling-gpu-live" = "python -m scripts.sir_convert_a_lot.live_docling_gpu_quality"
"run-local-pdm" = "bash scripts/devops/run-local-pdm.sh"
"run-hemma" = "bash scripts/devops/run-hemma.sh"
"hemma-verify-gpu-runtime" = "bash scripts/devops/verify-hemma-gpu-runtime.sh"
"hemma-deploy-and-verify" = "python -m scripts.sir_convert_a_lot.devops.hemma_deploy_and_verify"
"hemma-verify-v2-conversions" = "bash scripts/devops/verify-hemma-v2-conversions.sh"
"hemma-sync-prod-env-mirror" = "bash scripts/devops/sync-prod-env-mirror.sh"
"hemma-repair-rocm-runtime" = "bash scripts/devops/repair-hemma-rocm-runtime.sh"
"dev-start" = "bash scripts/devops/dev-compose.sh start"
"dev-stop" = "bash scripts/devops/dev-compose.sh stop"
"dev-build" = "bash scripts/devops/dev-compose.sh build"
"dev-build-clean" = "bash scripts/devops/dev-compose.sh build-clean"
"dev-recreate" = "bash scripts/devops/dev-compose.sh recreate"
"dev-logs" = "bash scripts/devops/dev-compose.sh logs"
"dev-ps" = "bash scripts/devops/dev-compose.sh ps"
"dev-config" = "bash scripts/devops/dev-compose.sh config"
"dev-check" = "bash scripts/devops/dev-compose.sh check"
"new-task" = "python -m scripts.docs_as_code.new_task"
"new-programme" = "python -m scripts.docs_as_code.new_task --type programme"
"new-epic" = "python -m scripts.docs_as_code.new_task --type epic"
"new-story" = "python -m scripts.docs_as_code.new_task --type story"
"new-review" = "python -m scripts.docs_as_code.new_task --type review"
"new-fix" = "python -m scripts.docs_as_code.new_task --type fix"
"new-doc" = "python -m scripts.docs_as_code.new_doc"
"new-rule" = "python -m scripts.docs_as_code.new_rule"
"validate-tasks" = "python -m scripts.docs_as_code.validate_tasks"
"validate-docs" = "python -m scripts.docs_as_code.validate_docs"
"docs-validate" = "python -m scripts.docs_as_code.validate_docs"
"index-tasks" = "python -m scripts.docs_as_code.index_tasks"
"format" = "ruff format ."
"format-md" = "mdformat --extensions frontmatter README.md AGENTS.md docs .agents"
"format-all" = { composite = [
    "ruff format .",
    "mdformat --extensions frontmatter README.md AGENTS.md docs .agents",
] }
"lint" = { composite = [
    "ruff format --check --diff .",
    "ruff check .",
    "mdformat --check --extensions frontmatter README.md AGENTS.md docs .agents",
    "python -m scripts.docs_as_code.validate_docs",
    "python -m scripts.docs_as_code.validate_tasks",
] }
"lint-fix" = { composite = [
    "ruff check --fix --unsafe-fixes .",
    "ruff format .",
    "mdformat --extensions frontmatter README.md AGENTS.md docs .agents",
    "python -m scripts.docs_as_code.validate_docs",
    "python -m scripts.docs_as_code.validate_tasks",
] }
"typecheck" = "mypy --config-file pyproject.toml"
"typecheck-all" = "mypy --config-file pyproject.toml"
"test" = "pytest -s"
"pytest-root" = "pytest -s"
"coverage-gate" = "pytest -s --cov=scripts.sir_convert_a_lot.application.contracts_v2 --cov=scripts.sir_convert_a_lot.domain.specs_v2 --cov=scripts.sir_convert_a_lot.infrastructure.job_store_models_v2 --cov=scripts.sir_convert_a_lot.infrastructure.runtime_models_v2 --cov=scripts.sir_convert_a_lot.infrastructure.runtime_config_v2 --cov=scripts.sir_convert_a_lot.infrastructure.runtime_heartbeat_v2 --cov=scripts.sir_convert_a_lot.infrastructure.v2_conversion_executor --cov=scripts.sir_convert_a_lot.infrastructure.runtime_engine_v2 --cov=scripts.sir_convert_a_lot.interfaces.http_routes_jobs_v2 --cov-branch --cov-report=term-missing --cov-report=xml --cov-config=pyproject.toml"

[tool.sir_convert_a_lot.rocm_runtime]
torch_index_url = "https://download.pytorch.org/whl/rocm7.1"
torch_version = "2.10.0+rocm7.1"
torchvision_version = "0.25.0+rocm7.1"
torchaudio_version = "2.10.0+rocm7.1"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
