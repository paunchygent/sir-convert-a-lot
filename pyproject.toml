[project]
name = "sir-convert-a-lot"
version = "0.1.0"
description = "Standalone, LLM-friendly conversion platform with canonical CLI/API surfaces."
authors = [
    { name = "Olof Larsson", email = "paunchygent@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.128.8",
    "uvicorn>=0.40.0",
    "python-multipart>=0.0.22",
    "prometheus-client>=0.23.1",
    "cryptography>=46.0.5",
    "httpx>=0.28.1",
    "typer>=0.16.0",
    "pydantic>=2.11.7",
    "pyyaml>=6.0.3",
    "mdformat>=1.0.0",
    "mdformat-gfm>=0.4.1",
    "weasyprint>=63.0",
    "docling==2.73.1",
    "easyocr==1.7.2",
    "pymupdf4llm==0.3.4",
    "dishka<2,>=1.7",
    "boto3>=1.42.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=6.2.1",
    "ruff>=0.14.0",
    "mypy>=1.18.2",
    "types-pyyaml>=6.0.12.20250915",
    "mdformat-frontmatter>=2.0.10",
]
tooling = [
    "repository-governance @ git+https://github.com/paunchygent/skill-repository.git@33352271b5872e6f2886b3969a5098a7f0338160#subdirectory=packages/repository_governance",
]

[tool.repository-governance]
schema-version = 3
repository = "sir-convert-a-lot"

[tool.repository-governance.owners]
service = ["sir-convert-a-lot"]

[tool.repository-governance.setup]
projects = [
    { path = ".", groups = ["default", "tooling", "dev"] },
    { path = "qwen", groups = ["default", "dev"] },
]

[tool.repository-governance.quality]
projects = [
    { path = ".", format = ["scripts", "tests"], lint = ["scripts", "tests"], typecheck-diagnostic-producer = "root-typecheck", test-diagnostic-producer = "root-test" },
]
producers = [
    { name = "root-typecheck", intent = "typecheck", project = ".", command = "typecheck-all", arguments = [] },
    { name = "root-test", intent = "test", project = ".", command = "pytest-root", arguments = [] },
]

[[tool.repository-governance.quality.cohorts]]
name = "behavior"
kind = "component-root"
root = "tests/sir_convert_a_lot"
test-target = "component"
typecheck = "root-typecheck"
test = "root-test"

[[tool.repository-governance.quality.validators]]
name = "docs-validate"
project = "."
command = "docs-validate"
arguments = []

[[tool.repository-governance.quality.validators]]
name = "skills-validate"
project = "."
command = "skills-validate"
arguments = []

[[tool.repository-governance.quality.validators]]
name = "handoff-validate"
project = "."
command = "handoff-validate"
arguments = []

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_return_any = true
check_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true
exclude = [
    "^scripts/sir_convert_a_lot/cli/ml/",
    "^scripts/sir_convert_a_lot/ml/qwen/",
]
files = [
    "scripts/sir_convert_a_lot",
    "tests/sir_convert_a_lot",
]

[tool.pytest.ini_options]
addopts = "-s -v"
python_files = "test_*.py *_test.py"
pythonpath = "."
testpaths = ["tests"]
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.coverage.run]
source = [
    "scripts.sir_convert_a_lot.application.contracts_v2",
    "scripts.sir_convert_a_lot.domain.specs_v2",
    "scripts.sir_convert_a_lot.infrastructure.job_store_models_v2",
    "scripts.sir_convert_a_lot.infrastructure.runtime_models_v2",
    "scripts.sir_convert_a_lot.infrastructure.runtime_config_v2",
    "scripts.sir_convert_a_lot.infrastructure.runtime_heartbeat_v2",
    "scripts.sir_convert_a_lot.infrastructure.v2_conversion_executor",
    "scripts.sir_convert_a_lot.infrastructure.runtime_engine_v2",
    "scripts.sir_convert_a_lot.interfaces.http_routes_jobs_v2",
]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
precision = 1

[tool.pdm]
distribution = false

[tool.pdm.scripts]
# repository-governance:bindings:start
setup = "/usr/bin/env -u PYTHONPATH -u PEP582_PACKAGES pdm run --project ${HOME}/.codex/repository-governance-runtime cross-repo-worktree-bootstrap --repo-root ${PDM_PROJECT_ROOT}"
new-worktree = "/usr/bin/env -u PYTHONPATH -u PEP582_PACKAGES pdm run --project ${HOME}/.codex/repository-governance-runtime cross-repo-worktree-create --repo-root ${PDM_PROJECT_ROOT}"
format = "repository-governance-routine format --repo-root ${PDM_PROJECT_ROOT}"
lint = "repository-governance-routine lint --repo-root ${PDM_PROJECT_ROOT}"
typecheck = "repository-governance-routine typecheck --repo-root ${PDM_PROJECT_ROOT}"
test = "repository-governance-routine test --repo-root ${PDM_PROJECT_ROOT}"
check = "repository-governance-routine check --repo-root ${PDM_PROJECT_ROOT}"
new-doc = "repository-governance-new-doc"
new-epic = "new-epic"
new-story = "new-story"
new-task = "new-task"
new-review = "new-review"
docs-sync = "repository-governance-docs-sync"
docs-validate = "repository-governance-docs-validate"
format-md = "format-md"
check-md = "check-md"
format-md-all = "format-md-all"
check-md-all = "check-md-all"
# repository-governance:bindings:end
# repository-governance:auxiliary-bindings:start
archive-documents = "repository-governance-archive-documents"
staleness-audit = "repository-governance-staleness-audit --repo-root ${PDM_PROJECT_ROOT}"
publish-main = "repository-governance-publish-main --repository-root ${PDM_PROJECT_ROOT}"
verify-main-publication = "repository-governance-verify-main-publication --repository-root ${PDM_PROJECT_ROOT}"
# repository-governance:auxiliary-bindings:end
