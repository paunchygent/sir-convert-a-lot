default_install_hook_types: [pre-commit, pre-merge-commit, pre-push]
repos: 
  - repo: local
    hooks:
      - id: markdown-format
        name: Markdown format (staged Markdown files)
        entry: pdm run format-md
        language: system
        types: [markdown]
        exclude: ^(docs/(index\.md|(backlog|decisions|reference|runbooks)/INDEX\.md)$|provenance/)
        pass_filenames: true
  - repo: local
    hooks:
      - id: out-of-domain-log-append-only
        name: Out-of-domain log append-only check
        entry: pdm run repository-governance-review-log-check
        language: system
        files: ^out-of-domain\.log$
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: task-merge-guard
        name: Refuse merging a task branch into main unless its task is done
        entry: pdm run repository-governance-task-merge-guard --stage merge
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-merge-commit, pre-commit]
      - id: task-merge-guard-push
        name: Refuse pushing main with a merged task branch whose task is not done
        entry: pdm run repository-governance-task-merge-guard --stage push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
