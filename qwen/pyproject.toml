[project]
name = "sir-convert-a-lot-qwen-research"
version = "0.1.0"
description = "Isolated Qwen research dependency and command boundary."
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.12.0",
    "datasets>=4.1.1",
    "huggingface-hub==0.34.4",
    "jiwer>=4.0.0",
    "librosa==0.11.0",
    "mlflow>=3.10.1",
    "numpy<2.5",
    "onnxruntime==1.23.1",
    "pyarrow==23.0.1",
    "qwen-tts==0.1.1",
    "safetensors==0.5.3",
    "sentencepiece==0.2.1",
    "soundfile==0.13.1",
    "sox==1.5.0",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "transformers==4.57.3",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "ruff>=0.14.0",
]

[tool.pdm]
distribution = false

[tool.pdm.scripts]
_.working_dir = ".."
_.env = { PYTHONPATH = "." }
qwen-acquire = "python -m scripts.sir_convert_a_lot.cli.ml.qwen_acquire"
qwen-batch-plan = "python -m scripts.sir_convert_a_lot.cli.ml.qwen_batch_plan"
qwen-containerized-preprocessing = "python -m scripts.sir_convert_a_lot.cli.ml.qwen_containerized_preprocessing"
qwen-detached-proof = "python -m scripts.sir_convert_a_lot.cli.ml.qwen_detached_proof"
qwen-codebook-fusion-proof = "python -m scripts.sir_convert_a_lot.cli.ml.qwen_codebook_fusion_proof"
qwen-codebook-fusion-proof-detached = "python -m scripts.sir_convert_a_lot.cli.ml.qwen_codebook_fusion_proof_detached"
qwen-docker-bind-roots = "python -m scripts.sir_convert_a_lot.devops.run_qwen_docker_bind_roots"
qwen-finalization-benchmark = "python -m scripts.sir_convert_a_lot.cli.ml.qwen_finalization_benchmark"
qwen-isolated-stages = "python -m scripts.sir_convert_a_lot.cli.ml.qwen_isolated_stages"
qwen-preprocess = "python -m scripts.sir_convert_a_lot.cli.ml.qwen_preprocess"
qwen-ref-mel-cache-comparison = "python -m scripts.sir_convert_a_lot.cli.ml.qwen_ref_mel_cache_comparison"
qwen-resume-proof = "python -m scripts.sir_convert_a_lot.cli.ml.qwen_resume_proof"
qwen-scratch-policy = "python -m scripts.sir_convert_a_lot.devops.run_hemma_scratch_policy"
qwen-fallback-eval-detached = "python -m scripts.sir_convert_a_lot.cli.ml.qwen_fallback_eval_detached_cli"
qwen-freshstart-proof = "python -m scripts.sir_convert_a_lot.cli.ml.qwen_freshstart_proof_cli"
qwen-backward-lineage = "python -m scripts.sir_convert_a_lot.cli.ml.qwen_backward_lineage_cli"
qwen-stability-lab = "python -m scripts.sir_convert_a_lot.cli.ml.qwen_stability_lab_cli"
qwen-parity-probe = "python -m scripts.sir_convert_a_lot.cli.ml.qwen_parity_probe_cli"
qwen-historical-pilot-control = "python -m scripts.sir_convert_a_lot.cli.ml.qwen_historical_pilot_control"
qwen-fallback-proof = "python -m scripts.sir_convert_a_lot.cli.ml.qwen_fallback_proof"
qwen-fallback-accumulation-proof = "python -m scripts.sir_convert_a_lot.cli.ml.qwen_fallback_accumulation_proof"
qwen-token-span-audit = "python -m scripts.sir_convert_a_lot.cli.ml.qwen_token_span_audit"
qwen-rixvox-train-staging = "python -m scripts.sir_convert_a_lot.cli.ml.qwen_rixvox_train_staging"
qwen-smoke = "python -m scripts.sir_convert_a_lot.cli.ml.qwen_smoke"
qwen-train = "python -m scripts.sir_convert_a_lot.cli.ml.qwen_train"
qwen-pilot-bundle = "python -m scripts.sir_convert_a_lot.cli.ml.qwen_bundle"
test = "pytest -c qwen/pyproject.toml -s --import-mode=importlib qwen/tests"
typecheck = "mypy --no-incremental --config-file qwen/pyproject.toml scripts/sir_convert_a_lot/cli/ml scripts/sir_convert_a_lot/ml/qwen scripts/devops/qwen_finetuning_patches qwen/tests"
format = "ruff format scripts/sir_convert_a_lot/cli/ml scripts/sir_convert_a_lot/ml/qwen scripts/devops/qwen_finetuning_patches qwen/tests"
lint = { composite = [
    "ruff format --check --diff scripts/sir_convert_a_lot/cli/ml scripts/sir_convert_a_lot/ml/qwen scripts/devops/qwen_finetuning_patches qwen/tests",
    "ruff check scripts/sir_convert_a_lot/cli/ml scripts/sir_convert_a_lot/ml/qwen scripts/devops/qwen_finetuning_patches qwen/tests",
] }
export-container-requirements = "python -m scripts.sir_convert_a_lot.devops.export_qwen_requirements"

[tool.pytest.ini_options]
addopts = "-s -v"
python_files = "test_*.py *_test.py"
pythonpath = [".."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_return_any = true
check_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E203"]

[tool.ruff.format]
quote-style = "double"
