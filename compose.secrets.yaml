---
# yamllint disable rule:line-length
# Secrets overlay for compose.yaml. Loaded only by the wrapped start, recreate
# and build paths in scripts/devops/compose-actions.sh through
# `agent-secrets run --set sir-convert-a-lot-prod`; ps, logs, stop, config and
# check load the base file only.
services:
  sir_convert_a_lot_prod:
    environment:
      - SIR_CONVERT_A_LOT_V2_API_KEY=${SIR_CONVERT_A_LOT_V2_API_KEY:?run through agent-secrets run --set sir-convert-a-lot-prod}

  sir_convert_a_lot_gpu_worker:
    environment:
      - SIR_CONVERT_A_LOT_V2_API_KEY=${SIR_CONVERT_A_LOT_V2_API_KEY:?run through agent-secrets run --set sir-convert-a-lot-prod}

  sir_convert_a_lot_stt_sidecar:
    environment:
      - HF_TOKEN=${HF_TOKEN:?run through agent-secrets run --set sir-convert-a-lot-prod}
